services:
  web:
    image: nginx:${NGINX_VERSION}-alpine
    container_name: ${LAB_WEB}
    restart: unless-stopped
    tty: true
    ports:
      - ${WEB_PORT}:80
      - ${SSL_PORT}:443
    volumes:
      - ./var/www:/var/www/html
      - ./etc/nginx:/etc/nginx/
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
      - NGINX_PORT=${WEB_PORT}
    depends_on:
      - php
      - db
    networks:
      - internal-net
  # Service PHP
  php:
    build:
      context: .
      dockerfile: ./NiMP/DockerPHP
    image: php:${PHP_VERSION}-fpm-alpine
    container_name: ${LAB_PHP}
    restart: unless-stopped
    tty: true
    working_dir: /var/www/html/
    volumes:
      - ./var/www:/var/www/html
      - ./etc/php/php:/usr/local/etc/php
      - ./etc/php/php-fpm.d:/usr/local/etc/php-fpm.d
      - ./etc/php/php-fpm.conf:/usr/local/etc/php-fpm.conf
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    networks:
      - internal-net
  db:
    image: mysql:${MYSQL_VERSION}
    container_name: ${LAB_DB}
    restart: unless-stopped
    tty: true
    ports:
      - ${DB_PORT}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - ./var/mysql:/var/lib/mysql
      - ./etc/mysql/my.cnf:/etc/my.cnf
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge
    name: ${LAB_NET}